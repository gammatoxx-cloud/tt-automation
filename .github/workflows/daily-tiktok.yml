name: Daily TikTok Drafts
on:
  schedule:
    # 15:00 UTC = 11:00am EDT (Eastern daylight). GitHub cron is UTC-only and does NOT adjust for DST,
    # so when clocks fall back to EST (Nov–Mar) this fires at 10:00am Eastern. To keep it at 11:00am
    # EST in winter, change to '0 16 * * *'. May run 10–30 min late (GitHub scheduler drift).
    - cron: '0 15 * * *'
  workflow_dispatch: {}     # manual "Run workflow" button for testing
permissions:
  contents: write           # lets the job commit the updated queue.json
jobs:
  push-drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Push next slideshows to TikTok drafts
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          POSTS_PER_RUN: '2'
        run: node scripts/post-next.mjs
      - name: Commit updated queue
        run: |
          git config user.name "slideshow-bot"
          git config user.email "bot@users.noreply.github.com"
          git add queue.json
          git commit -m "Mark slideshow(s) posted" || echo "nothing to commit"
          git push