name: Daily TikTok Drafts
on:
  schedule:
    - cron: '0 15 * * *'   # 15:00 UTC — adjust to your local slot; UTC only, may run 10–30 min late
  workflow_dispatch: {}     # manual "Run workflow" button for testing
permissions:
  contents: write           # lets the job commit the updated queue.json
jobs:
  push-drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Push next slideshows to TikTok drafts
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          POSTS_PER_RUN: '2'
        run: node scripts/post-next.mjs
      - name: Commit updated queue
        run: |
          git config user.name "slideshow-bot"
          git config user.email "bot@users.noreply.github.com"
          git add queue.json
          git commit -m "Mark slideshow(s) posted" || echo "nothing to commit"
          git push